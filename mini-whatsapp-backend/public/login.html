<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>

<body>

<h2>Login</h2>

<input 
type="email" 
id="email" 
placeholder="Email">

<br><br>

<input 
type="password" 
id="password" 
placeholder="Password">

<br><br>

<button onclick="login()">
Login
</button>


<script>

async function login(){

    const email =
    document.getElementById("email").value;

    const password =
    document.getElementById("password").value;


    const response = await fetch(
        "http://localhost:3000/api/auth/login",
        {
            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                email:email,
                password:password
            })
        }
    );


    const data = await response.json();


    console.log(data);


    if(data.success){

        // Save JWT Token
        localStorage.setItem(
            "token",
            data.token
        );


        // Save User Data
        localStorage.setItem(
            "user",
            JSON.stringify(data.user)
        );


        alert("Login Successful");


        window.location.href =
        "/chat.html";

    }else{

        alert(data.message);

    }

}

</script>

</body>
</html>
