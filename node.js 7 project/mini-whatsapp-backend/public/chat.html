<!DOCTYPE html>
<html>
<head>
    <title>Chat</title>
    <style>
        #messages {
            border: 1px solid #ccc;
            height: 200px;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 10px;
        }
        .message {
            margin: 8px 0;
            padding: 8px;
            border-radius: 8px;
        }
        .message img {
            max-width: 300px;
            max-height: 300px;
            display: block;
            margin-top: 5px;
        }
        .message video {
            max-width: 300px;
            max-height: 300px;
            display: block;
            margin-top: 5px;
        }
        .download-btn {
            display: inline-block;
            margin-top: 5px;
            padding: 5px 10px;
            background: #128C7E;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        .file-name {
            margin-top: 5px;
            font-size: 14px;
        }
        .message {
            position: relative;
            margin: 10px 0;
            padding: 8px 12px;
            background: #dcf8c6;
            border-radius: 8px;
            max-width: 70%;
        }

            .reaction-btn {
                display: none;
                position: absolute;
                top: -45px;
                left: 0;
                background: white;
                border: 1px solid #ddd;
                border-radius: 20px;
                padding: 5px;
                box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            }

            .message:hover .reaction-btn {
                display: flex;
                gap: 5px;
            }

            .reaction-btn button {
                border: none;
                background: transparent;
                font-size: 20px;
                cursor: pointer;
            }

            .reaction-btn button:hover {
                transform: scale(1.3);
            }

            .message-reactions {
                margin-top: 5px;
                font-size: 18px;
            }

    </style>

</head>


<body>


    <h2>WhatsApp Chat</h2>
    <h3 id="user"></h3>
    <div id="status"></div>
    <!-- ONLINE USERS -->
    <h3>Online Users</h3>
    <div id="onlineUsers"></div>
    <hr>
    <!-- PRIVATE CHAT -->
    <h3>Private Chat</h3>
    <p> Selected User :
        <strong id="chatUser">None </strong>
    </p>


    <!-- ALL PRIVATE MESSAGES -->

    <div id="messages"></div>
    <!-- TYPING STATUS -->
    <div
        id="typingStatus"
        style="color:green;
            font-style:italic;
            margin-bottom:5px;">
    </div>

    <!-- TEXT MESSAGE -->
    <input type="text"id="messageInput"placeholder="Type message">
    <button type="button"onclick="sendMessage()">Send</button>

    <hr>
    <!-- GROUPS -->

    <h3>Groups</h3>
    <input type="text"id="groupNameInput"placeholder="Enter Group Name">

    <button type="button"onclick="createGroup()">Create Group</button>
    <div id="groupList"></div>
    <h3>Members</h3>
    <div id="members"></div>
    <button type="button"onclick="loadMembers()">Load Members</button>
    <button type="button"onclick="leaveGroup()">Leave Group</button>

    <hr>

    <!-- IMAGE UPLOAD -->
    <h3>Images Upload</h3>
    <input type="file"id="imageInput"accept="image/*">
    <button type="button"onclick="sendPrivateImage()">Send Image</button>
    <hr>



    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>

</body>
</html>
